<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Professional audiobook and podcast production studio with multi-provider TTS, timeline editing, and audio mastering." />
    <meta name="theme-color" content="#f4f7fb" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>" />
    <title>Bookx — Audio workspace</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { background: #f4f7fb; color: #162b3d; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f4f7fb; color: #162b3d; }
    </style>
    <script>
      /* Set the theme before first paint to avoid a flash of the wrong colours.
         This runs in <head>, so document.body doesn't exist yet — the attribute
         goes on <html> and the rule above colours both elements. */
      (function() {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>JavaScript is required to run this application.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
